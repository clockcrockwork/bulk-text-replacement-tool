# 依存更新の自動PR。public リポジトリなので Actions の実行枠は無制限だが、
# レビュー回数を抑えるため patch/minor はまとめて1本のPRにする。
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      # @types/node は .nvmrc / engines の Node 22 に合わせて固定する。
      # major が上がると、実行する Node に無い API が型として通ってしまう。
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      # 破壊的変更が入りにくい範囲は1本に束ねる。major は個別PRのまま残す。
      minor-and-patch:
        update-types:
          - minor
          - patch

  # ワークフローの Action はコミット SHA で固定している。固定したままだと更新が
  # 止まるので、この設定で SHA と後ろの `# vX.Y.Z` を一緒に書き換える PR を受け取る。
  # `directory: /` が見るのは .github/workflows だけ。.github/actions に composite action を
  # 足したら、その中の Action も追従させるために、ここへ対象のディレクトリを足す。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      # major は動かなくなる変更を含みうるので、束ねずに個別PRで見る。
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
