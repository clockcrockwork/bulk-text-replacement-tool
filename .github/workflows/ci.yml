name: CI

on:
  # PR 中のブランチへの push は pull_request 側で走るため、push は main だけにする。
  # 両方を全ブランチ対象にすると、同じコミットに対して同名のチェックが2系統報告され、
  # required status checks の判定が不安定になる。
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN はリポジトリの読み取りだけにする。どのジョブも checkout とテストしか
# しないので、書き込み権限を持たせる理由が無い（依存のスクリプトや Action が
# 乗っ取られたときに、push やリリースの改ざんまで届かせない）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action はタグではなくコミットの full SHA で固定する。タグは後から別のコミットへ
# 付け替えられるので、`@v7` のままだと Action 側が乗っ取られたときに、中身が黙って
# 差し替わる。行末の `# vX.Y.Z` は Dependabot が SHA と一緒に書き換える
# （.github/dependabot.yml の github-actions）。手で更新するときも両方を揃える。
jobs:
  check:
    name: Lint / Types / Unit tests / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint & format check
        run: npm run lint
      - name: Unit tests
        run: npm run coverage
      # build は typecheck も兼ねる（package.json の build スクリプト）
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright report
        # 成功時に上げても読む機会が無いので失敗時だけ。トレースは test-results/ に出る。
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
