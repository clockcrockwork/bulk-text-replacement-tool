name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint & format check
        run: npm run lint
      - name: Unit tests
        run: npm run test
      # build は typecheck も兼ねる（package.json の build スクリプト）
      - name: Build
        run: npm run build
